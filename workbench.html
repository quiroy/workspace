<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#eef5f1">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>工作台</title>
<style>
  :root {
    --bg: #eef5f1;
    --card-bg: #ffffff;
    --sidebar-bg: #f0eee9;
    --sidebar-active: #e5e2db;
    --sidebar-text: #6b6b6b;
    --sidebar-text-active: #1a1a1a;
    --sidebar-accent: #7ba7d9;
    --primary: #7ba7d9;
    --primary-light: #e8f0f8;
    --header-bg: #e8f3ee;
    --header-border: #d5e6dd;
    --danger: #ff5750;
    --danger-light: #fff0ef;
    --success: #34c759;
    --warning: #ff9f0a;
    --warning-light: #fff8ed;
    --text-1: #1a1a1a;
    --text-2: #8a8a8e;
    --text-3: #b0b0b5;
    --border: #ececef;
    --shadow: 0 2px 12px rgba(0,0,0,0.04);
    --radius: 16px;
    --radius-sm: 10px;
    --sidebar-w: 260px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: var(--bg);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
  }

  /* App Layout */
  .app {
    display: flex;
    height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 50;
  }

  .sidebar-header {
    padding: 28px 24px 20px;
  }

  .sidebar-header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-header .logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--sidebar-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #fff;
    font-weight: 700;
  }

  .sidebar-header .logo-text {
    font-size: 17px;
    font-weight: 600;
    color: var(--sidebar-text-active);
  }

  .sidebar-section-label {
    font-size: 11px;
    color: var(--sidebar-text);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0 24px;
    margin-top: 20px;
    margin-bottom: 8px;
    opacity: 0.6;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 20px;
  }

  .sidebar-nav::-webkit-scrollbar { width: 0; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    cursor: pointer;
    color: var(--sidebar-text);
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    font-family: inherit;
    position: relative;
  }

  .nav-item:hover {
    color: var(--sidebar-text-active);
    background: rgba(255,255,255,0.03);
  }

  .nav-item.active {
    color: var(--sidebar-text-active);
    background: var(--sidebar-active);
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    background: var(--sidebar-accent);
    border-radius: 0 2px 2px 0;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .nav-item .count-badge {
    margin-left: auto;
    font-size: 11px;
    color: var(--sidebar-text);
    background: rgba(255,255,255,0.08);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }

  .nav-item.active .count-badge {
    background: var(--sidebar-accent);
    color: #fff;
  }

  /* Sidebar Footer */
  .sidebar-footer {
    padding: 16px 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--sidebar-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #fff;
    font-weight: 600;
    flex-shrink: 0;
  }

  .sidebar-footer .user-name {
    font-size: 13px;
    color: var(--sidebar-text);
  }

  /* Main Content */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .main-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
    z-index: 10;
  }

  .main-header .page-title {
    font-size: 20px;
    font-weight: 700;
  }

  .main-header .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: none;
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    transition: all 0.15s;
  }

  .icon-btn:hover {
    background: var(--primary-light);
    color: var(--primary);
  }

  .icon-btn.active {
    background: var(--primary-light);
    color: var(--primary);
  }

  .icon-btn svg { width: 18px; height: 18px; }

  .menu-toggle {
    display: none;
  }

  /* Content Area */
  .content {
    flex: 1;
    overflow: hidden;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .page {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: var(--bg);
    display: none;
    flex-direction: column;
  }

  .page.active {
    display: flex;
  }

  .page-home {
    padding: 24px 28px;
  }

  .page-summary {
    padding: 0;
  }

  .summary-page-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    min-height: 0;
  }

  .summary-page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--header-border);
    background: var(--header-bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .summary-page-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-1);
  }

  .summary-back-btn {
    color: var(--text-2);
  }

  .summary-page-content {
    padding: 20px;
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
  }

  /* ========== Schedule View ========== */
  .date-display-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: box-shadow 0.15s;
  }

  .date-display-bar:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.08); }

  .date-display-main {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .date-display-text {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-1);
  }

  .date-display-week {
    font-size: 15px;
    font-weight: 500;
    color: var(--primary);
  }

  .date-display-icon {
    width: 20px;
    height: 20px;
    color: var(--text-3);
    transition: transform 0.2s;
  }

  .date-display-bar.open .date-display-icon {
    transform: rotate(90deg);
  }

  /* Calendar Popup */
  .calendar-popup {
    display: none;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    animation: expandDown 0.2s ease;
  }

  .calendar-popup.show { display: block; }

  @keyframes expandDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .calendar-card {
    background: transparent;
    padding: 0;
    box-shadow: none;
    margin-bottom: 0;
  }

  .today-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.15s;
  }

  .today-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* Calendar */
  .calendar-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: nowrap;
    gap: 8px;
    min-width: 0;
  }

  .calendar-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
    flex-shrink: 1;
  }

  .calendar-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-1);
    white-space: nowrap;
  }

  .calendar-today-label {
    font-size: 13px;
    color: var(--text-3);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .calendar-today-label .today-num {
    color: var(--primary);
    font-weight: 600;
  }

  .calendar-nav {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    flex-wrap: nowrap;
  }

  .cal-nav-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    font-size: 16px;
    transition: all 0.15s;
  }

  .cal-nav-btn:hover { border-color: var(--primary); color: var(--primary); }

  .jump-box {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 8px;
    white-space: nowrap;
  }

  .jump-box input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-2);
    font-family: inherit;
    outline: none;
    background: var(--bg);
    cursor: pointer;
  }

  .jump-box input[type="date"]:focus { border-color: var(--primary); }

  .jump-go {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: opacity 0.15s;
  }

  .jump-go:active { opacity: 0.7; }

  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 6px;
  }

  .weekday-label {
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    font-weight: 600;
    padding: 6px 0;
  }

  .weekday-label.weekend { color: var(--danger); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-day {
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.12s;
    border: none;
    background: transparent;
    font-family: inherit;
    position: relative;
    gap: 2px;
  }

  .cal-day:hover { background: var(--bg); }

  .cal-day .day-num {
    font-size: 14px;
    color: var(--text-1);
    font-weight: 500;
    line-height: 1;
  }

  .cal-day.other-month .day-num { color: var(--text-3); opacity: 0.4; }
  .cal-day.today .day-num {
    color: var(--primary);
    font-weight: 700;
  }
  .cal-day.selected {
    background: var(--primary);
  }
  .cal-day.selected .day-num { color: #fff; }

  .cal-day .event-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--primary);
  }

  .cal-day.selected .event-dot { background: #fff; }
  .cal-day.other-month .event-dot { opacity: 0.3; }

  /* Event List for selected date */
  .event-list-section {
    margin-top: 16px;
  }

  .schedule-date-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    cursor: pointer;
    user-select: none;
  }

  .schedule-date-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: nowrap;
  }

  .schedule-date-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-1);
  }

  .schedule-week-text {
    font-size: 13px;
    color: var(--text-3);
  }

  .batch-delete-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .batch-delete-btn:hover {
    background: var(--danger-light);
    color: var(--danger);
  }

  .batch-delete-btn svg { width: 18px; height: 18px; }

  .batch-delete-btn.active {
    background: var(--danger-light);
    color: var(--danger);
  }

  /* Batch bar */
  .batch-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--card-bg);
    border-radius: 10px;
    box-shadow: var(--shadow);
    margin-top: 10px;
  }

  .batch-bar.show { display: flex; }

  .batch-select-all {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    user-select: none;
  }

  .batch-select-all input {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .batch-delete-action {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    background: var(--danger);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .batch-delete-action:hover { opacity: 0.9; }
  .batch-delete-action:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Clear button in calendar */
  .clear-cal-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .clear-cal-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: var(--danger-light);
  }

  /* Inline Calendar */
  .inline-calendar {
    display: none;
    padding: 16px;
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-top: 12px;
    animation: slideDown 0.2s ease;
  }

  .inline-calendar.show { display: block; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .inline-cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .inline-cal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-1);
  }

  .inline-cal-nav {
    display: flex;
    gap: 6px;
  }

  .inline-cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }

  .inline-cal-weekdays .weekday-label {
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    padding: 6px 0;
    font-weight: 500;
  }

  .inline-cal-weekdays .weekday-label.weekend { color: var(--danger); }

  .inline-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .inline-cal-grid .cal-day {
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-1);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: inherit;
    transition: all 0.15s;
    position: relative;
  }

  .inline-cal-grid .cal-day:hover { background: var(--bg-2); }
  .inline-cal-grid .cal-day.other-month { color: var(--text-3); opacity: 0.5; }
  .inline-cal-grid .cal-day.today { color: var(--primary); font-weight: 700; }
  .inline-cal-grid .cal-day.selected { background: var(--primary); color: #fff; font-weight: 600; }
  .inline-cal-grid .cal-day.selected:hover { background: var(--primary); }

  .inline-cal-grid .cal-day .day-num { line-height: 1; }
  .inline-cal-grid .cal-day .event-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary);
  }
  .inline-cal-grid .cal-day.selected .event-dot { background: #fff; }

  .inline-cal-jump {
    display: flex;
    gap: 6px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    align-items: center;
  }

  .inline-cal-jump input[type="date"] {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-1);
    background: var(--bg-1);
  }

  .event-list-count-row {
    margin-bottom: 10px;
  }

  .event-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .event-card {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s;
    border-left: 3px solid var(--primary);
  }

  .event-card:active { transform: scale(0.98); }

  .event-card.cat-work { border-left-color: var(--primary); }
  .event-card.cat-personal { border-left-color: var(--success); }
  .event-card.cat-important { border-left-color: var(--danger); }
  .event-card.cat-other { border-left-color: var(--warning); }

  .event-time-block {
    flex-shrink: 0;
    text-align: center;
    min-width: 48px;
  }

  .event-time-block .start {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-1);
    line-height: 1;
  }

  .event-time-block .end {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .event-body { flex: 1; min-width: 0; }

  .event-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-1);
    line-height: 1.4;
  }

  .event-desc {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 4px;
    line-height: 1.3;
  }

  .add-event-btn {
    width: 100%;
    padding: 12px;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    background: #ffffff;
    color: var(--text-3);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .add-event-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }

  .custom-cat-box {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }

  .custom-cat-box .text-input { flex: 1; }

  /* Event checkbox & delete */
  .event-checkbox {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    background: transparent;
    margin-top: 1px;
  }

  .event-checkbox.checked {
    background: var(--success);
    border-color: var(--success);
  }

  .event-checkbox.checked::after {
    content: '';
    width: 5px;
    height: 9px;
    border: 2px solid #fff;
    border-top: 0;
    border-left: 0;
    transform: rotate(45deg) translateY(-1px);
  }

  .event-card.completed .event-title {
    text-decoration: line-through;
    color: var(--text-3);
  }

  .event-card.completed { opacity: 0.6; }

  .event-delete-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    border-radius: 6px;
    transition: all 0.15s;
  }

  .event-delete-btn:hover {
    color: var(--danger);
    background: var(--danger-light);
  }

  .event-delete-btn svg { width: 16px; height: 16px; }

  .batch-checkbox {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    background: transparent;
    margin-top: 1px;
  }

  .batch-checkbox.checked {
    background: var(--primary);
    border-color: var(--primary);
  }

  .batch-checkbox.checked::after {
    content: '';
    width: 5px;
    height: 9px;
    border: 2px solid #fff;
    border-top: 0;
    border-left: 0;
    transform: rotate(45deg) translateY(-1px);
  }

  .event-card.batch-selected {
    background: var(--primary-light);
    border-color: var(--primary);
  }

  .event-category-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    margin-top: 4px;
    display: inline-block;
  }

  .event-category-tag.cat-work { background: var(--primary-light); color: var(--primary); }
  .event-category-tag.cat-personal { background: #eef9f0; color: var(--success); }
  .event-category-tag.cat-important { background: var(--danger-light); color: var(--danger); }
  .event-category-tag.cat-custom { background: var(--warning-light); color: var(--warning); }

  .event-tags {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .event-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
    display: inline-block;
  }

  .event-tag.tag-cat {
    background: var(--bg-2);
    color: var(--text-2);
  }

  .event-tag.tag-pri-normal {
    background: #eef2f7;
    color: #6b7a8f;
  }

  .event-tag.tag-pri-important {
    background: var(--danger-light);
    color: var(--danger);
    font-weight: 600;
  }

  /* Priority border colors */
  .event-card.pri-normal { border-left-color: var(--text-3); }
  .event-card.pri-important { border-left-color: var(--danger); }

  /* ========== Inspiration View ========== */
  .inspiration-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .search-box {
    flex: 1;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--card-bg);
    outline: none;
    font-family: inherit;
    color: var(--text-1);
  }

  .search-box input:focus { border-color: var(--primary); }

  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--text-3);
  }

  .filter-chips {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
    font-weight: 500;
    font-family: inherit;
    transition: all 0.15s;
  }

  .filter-chip.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* Quick Capture */
  .quick-capture {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .quick-capture textarea {
    width: 100%;
    border: none;
    outline: none;
    font-size: 15px;
    resize: none;
    min-height: 60px;
    font-family: inherit;
    color: var(--text-1);
    background: transparent;
  }

  .quick-capture textarea::placeholder { color: var(--text-3); }

  .quick-capture-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .tag-selector {
    display: flex;
    gap: 6px;
  }

  .tag-btn {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #ffffff;
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .tag-btn.selected {
    background: #ffffff;
    color: var(--primary);
    border-color: var(--primary);
  }

  .capture-btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .capture-btn:active { opacity: 0.7; }
  .capture-btn:disabled { opacity: 0.4; cursor: default; }

  /* Inspiration Cards */
  /* Checkin */
  .checkin-container {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .checkin-header-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }

  .checkin-streak {
    text-align: center;
  }

  .streak-num {
    font-size: 42px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
  }

  .streak-label {
    font-size: 13px;
    color: var(--text-2);
    margin-top: 6px;
  }

  .checkin-today {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .today-date {
    font-size: 15px;
    color: var(--text-2);
  }

  .checkin-progress {
    font-size: 20px;
    font-weight: 600;
    color: var(--primary);
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-header .section-title {
    margin-bottom: 0;
  }

  .add-item-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .add-item-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .add-item-btn svg {
    width: 14px;
    height: 14px;
  }

  .checkin-items {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .checkin-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: #f5faf7;
    border-radius: 12px;
    transition: all 0.15s;
  }

  .checkin-item.checked {
    background: #e8f0f8;
  }

  .checkin-item-checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #ccc;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .checkin-item.checked .checkin-item-checkbox {
    background: var(--primary);
    border-color: var(--primary);
  }

  .checkin-item-checkbox svg {
    width: 12px;
    height: 12px;
    stroke: #fff;
    stroke-width: 3;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .checkin-item.checked .checkin-item-checkbox svg {
    opacity: 1;
  }

  .checkin-item-info {
    flex: 1;
    min-width: 0;
  }

  .checkin-item-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-1);
  }

  .checkin-item.checked .checkin-item-name {
    text-decoration: line-through;
    color: var(--text-3);
  }

  .checkin-item-streak {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .checkin-item-delete {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: #ccc;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .checkin-item-delete:hover {
    background: rgba(0,0,0,0.05);
    color: var(--danger);
  }

  .checkin-item-delete svg {
    width: 16px;
    height: 16px;
  }

  .checkin-section {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 16px;
  }

  .checkin-calendar {
    user-select: none;
  }

  .checkin-cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
  }

  .checkin-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    margin-bottom: 8px;
  }

  .checkin-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .checkin-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-2);
    background: #f5faf7;
    position: relative;
  }

  .checkin-cell .cal-day-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--primary);
  }

  .checkin-cell.partial .cal-day-dot {
    background: #a8c4e0;
  }

  .checkin-cell.checked {
    color: var(--text-1);
    font-weight: 500;
  }

  .checkin-cell.partial {
    color: var(--text-2);
  }

  .checkin-cell.today {
    border: 2px solid var(--primary);
  }

  .checkin-cell.other-month {
    background: transparent;
    color: #ccc;
  }

  .inspiration-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .inspiration-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
    position: relative;
    border-top: 3px solid var(--primary);
  }

  .inspiration-card:active { transform: scale(0.98); }
  .inspiration-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.08); }

  .inspiration-card.tag-idea { border-top-color: var(--primary); }
  .inspiration-card.tag-todo { border-top-color: var(--warning); }
  .inspiration-card.tag-quote { border-top-color: var(--success); }
  .inspiration-card.tag-question { border-top-color: #c9b896; }
  .inspiration-card.tag-feeling { border-top-color: #b8a5d9; }

  .inspiration-content {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-1);
    word-break: break-word;
    white-space: pre-wrap;
  }

  .inspiration-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .inspiration-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .inspiration-tag.tag-idea { background: var(--primary-light); color: var(--primary); }
  .inspiration-tag.tag-todo { background: var(--warning-light); color: var(--warning); }
  .inspiration-tag.tag-quote { background: #eef9f0; color: var(--success); }
  .inspiration-tag.tag-question { background: #ffffff; color: #b09b74; border: 1px solid #e0d6c0; }
  .inspiration-tag.tag-feeling { background: #ffffff; color: #8b7ab5; border: 1px solid #e0d8ec; }

  .inspiration-time {
    font-size: 11px;
    color: var(--text-3);
  }

  .inspiration-actions {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .insp-action-btn {
    font-size: 12px;
    border: none;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    padding: 2px 4px;
    font-family: inherit;
  }

  .insp-action-btn:hover { color: var(--text-1); }

  .insp-action-btn:last-of-type {
    margin-right: 2px;
  }

  .inspiration-star {
    width: 20px;
    height: 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text-3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .inspiration-star.starred { color: var(--warning); }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-3);
  }

  .empty-state .empty-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-state .empty-icon svg { width: 28px; height: 28px; }

  .empty-state .empty-text {
    font-size: 14px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }

  .modal-overlay.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--card-bg);
    width: 90%;
    max-width: 480px;
    border-radius: 16px;
    padding: 24px;
    animation: scaleIn 0.2s ease;
  }

  @keyframes scaleIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Archive Modal */
  .archive-modal {
    width: 90%;
    max-width: 520px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
  }

  .archive-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .archive-title {
    font-size: 16px;
    font-weight: 600;
  }

  .archive-year-btn {
    display: flex;
    align-items: center;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    font-family: inherit;
  }

  .archive-year-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .archive-year-picker {
    display: none;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .archive-year-picker.show {
    display: block;
  }

  .year-picker-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .year-nav-btn {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .year-nav-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  #archiveYearPickerText {
    font-size: 15px;
    font-weight: 600;
    min-width: 70px;
    text-align: center;
  }

  .archive-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px 20px;
  }

  .archive-month-group {
    margin-bottom: 20px;
  }

  .archive-month-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    user-select: none;
  }

  .archive-month-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
  }

  .archive-month-count {
    font-size: 12px;
    color: var(--text-3);
  }

  .archive-month-arrow {
    font-size: 12px;
    color: var(--text-3);
    transition: transform 0.2s;
  }

  .archive-month-group.expanded .archive-month-arrow {
    transform: rotate(180deg);
  }

  .archive-month-items {
    display: none;
    padding: 8px 0;
  }

  .archive-month-group.expanded .archive-month-items {
    display: block;
  }

  .archive-item {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .archive-item:hover {
    background: var(--bg-hover);
  }

  .archive-item-text {
    font-size: 13px;
    color: var(--text-1);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .archive-item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-3);
  }

  .archive-item-tag {
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 10px;
  }

  .archive-empty {
    text-align: center;
    padding: 40px 0;
    color: var(--text-3);
    font-size: 14px;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .input-group { margin-bottom: 16px; }

  .input-group label {
    display: block;
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .text-input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--text-1);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
    background: var(--bg);
  }

  .text-input:focus { border-color: var(--primary); background: #fff; }

  .text-area { min-height: 70px; resize: none; }

  .time-row {
    display: flex;
    gap: 12px;
  }

  .time-row .input-group { flex: 1; }

  .option-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .option-chip {
    flex: 1;
    min-width: 0;
    padding: 10px 8px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-weight: 500;
    font-family: inherit;
  }

  .option-chip.selected {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .btn:active { opacity: 0.7; }
  .btn-cancel { background: var(--bg); color: var(--text-2); }
  .btn-confirm { background: var(--primary); color: #fff; }

  /* Mobile overlay for sidebar */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 40;
  }

  /* ====== Summary Panel ====== */
  .summary-section { margin-bottom: 28px; }

  .summary-section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .summary-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .summary-stat {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 16px 10px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .summary-stat-num {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-1);
    margin-bottom: 4px;
  }

  .summary-stat-label {
    font-size: 11px;
    color: var(--text-3);
  }

  /* Trend chart */
  .trend-chart {
    width: 100%;
    background: #fff;
    border-radius: 10px;
    padding: 12px 8px 4px;
    margin-top: 10px;

  .trend-chart canvas {

  .legend-total { background: #a8b4d4; }
  .legend-done { background: var(--primary); }

  .summary-section-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .trend-nav {

    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-2);
  }

  .trend-nav-btn {

    height: 22px;
    border-radius: 5px;
    border: 1px solid rgba(0,0,0,0.1);

    color: var(--text-2);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;

    align-items: center;
    justify-content: center;
    padding: 0;

  .trend-nav-btn:hover {
    border-color: var(--primary);

  }

  .trend-range {
    font-size: 11px;
    white-space: nowrap;
    font-weight: 500;
  }

  .trend-chart-sm {
    margin-top: 8px;
    padding: 8px 6px 2px;
  }

  .month-trend-wrap {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(0,0,0,0.08);
  }

  .month-trend-title {
    font-size: 13px;
    margin-bottom: 8px;
  }

  .summary-days {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .summary-day {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 14px;
    box-shadow: var(--shadow);
  }

  .summary-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .summary-day-date {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
  }

  .summary-day-count {
    font-size: 12px;
    color: var(--text-3);
    background: var(--bg-2);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .summary-day-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .summary-day-item {
    font-size: 13px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .summary-day-item.done { color: var(--text-3); text-decoration: line-through; }

  .summary-day-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    flex-shrink: 0;
  }

  .summary-day-item.done .summary-day-dot { background: var(--text-3); }

  /* Summary Calendar */
  .summary-cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .summary-cal-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-1);
  }

  .summary-cal-nav {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    background: var(--bg-2);
    color: var(--text-2);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .summary-cal-nav:hover { background: var(--border); color: var(--text-1); }

  .summary-cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 4px;
  }

  .summary-cal-weekdays .wd-label {
    text-align: center;
    font-size: 11px;
    color: var(--text-3);
    padding: 4px 0;
    font-weight: 500;
  }

  .summary-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .summary-cal-cell {
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 12px;
    color: #1a1a1a;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: inherit;
    transition: all 0.15s;
    position: relative;
  }

  .cal-day-num {
    line-height: 1;
  }

  .cal-day-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
  }

  .cal-day-dot.dot-done {
    background: #7ba7d9;
  }

  .cal-day-dot.dot-task {
    background: #8b8f9a;
  }

  .summary-cal-cell.selected .cal-day-dot.dot-done,
  .summary-cal-cell.selected .cal-day-dot.dot-task {
    background: #fff;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
  }

  .summary-cal-cell:hover { background: rgba(0,0,0,0.06); }
  .summary-cal-cell.other-month { color: rgba(0,0,0,0.3); opacity: 1; }
  .summary-cal-cell.today { color: var(--primary); font-weight: 700; }
  .summary-cal-cell.selected { background: var(--primary); color: #fff; font-weight: 600; }
  .summary-cal-cell.selected:hover { background: var(--primary); }

  .summary-cal-weekdays .wd-label { color: rgba(0,0,0,0.4); }

  .summary-cal-jump {

    gap: 6px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);

  }

  .summary-cal-jump input[type="date"] {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text-1);
    background: var(--bg-1);

  .summary-month-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(0,0,0,0.08);

  .summary-stat-card {
    background: #fff;
    border-radius: 8px;
    padding: 12px 6px;
    text-align: center;
  }

  .summary-stat-card .summary-stat-num {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  .summary-stat-card .summary-stat-label {
    font-size: 11px;
    color: #888;
  }

  /* Day detail popup */
  .day-popup-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .day-popup-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .day-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    width: 320px;
    max-width: 85vw;
    max-height: 70vh;
    background: #fff;
    border-radius: 14px;
    z-index: 301;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .day-popup.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .day-popup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }

  .day-popup-title {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .day-popup-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px;
  }

  .day-popup-task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }

  .day-popup-task:last-child { border-bottom: none; }

  .day-popup-task.done .day-popup-task-title { text-decoration: line-through; color: #999; }

  .day-popup-task-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    flex-shrink: 0;
  }

  .day-popup-task.done .day-popup-task-dot { background: #ccc; }

  .day-popup-task-title {
    flex: 1;
    font-size: 14px;
    color: #1a1a1a;
    min-width: 0;
  }

  .day-popup-task-time {
    font-size: 12px;
    color: #999;
    flex-shrink: 0;
  }

  .day-popup-empty {
    text-align: center;
    font-size: 14px;
    color: #999;
    padding: 30px 0;
    font-style: italic;
  }

  /* Summary day list (detail) */
  .summary-day-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .summary-day-task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--card-bg);
    border-radius: 8px;
    box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.05));
  }

  .summary-day-task.done .summary-day-task-title { text-decoration: line-through; color: var(--text-3); }

  .summary-day-task-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    flex-shrink: 0;
  }

  .summary-day-task.done .summary-day-task-dot { background: var(--text-3); }

  .summary-day-task-title {
    flex: 1;
    font-size: 13px;
    color: var(--text-1);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary-day-task-time {
    font-size: 11px;
    color: var(--text-3);
    flex-shrink: 0;
  }

  .summary-day-empty {
    text-align: center;
    font-size: 13px;
    color: var(--text-3);
    padding: 20px 0;
    font-style: italic;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      transform: translateX(-100%);
    }

    .sidebar.open { transform: translateX(0); }
    .sidebar.open ~ .sidebar-overlay { display: block; }

    .menu-toggle {
      display: flex;
    }

    .content { padding: 16px; }
    .main-header { padding: 16px; }
    .inspiration-grid { grid-template-columns: 1fr; }
    .jump-box { display: none; }
    .calendar-title { font-size: 16px; }
    .calendar-today-label { font-size: 12px; }
  }
</style>
</head>

<div class="app">
  <!-- Sidebar -->

      </button>
    </nav>

    <div class="sidebar-footer">

  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Main Content -->

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        </button>

        </button>
        <button class="icon-btn" onclick="openScheduleModal()" title="添加日程">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="content" id="contentArea">
      <!-- Home page (schedule + inspiration) -->

            <span class="schedule-week-text" id="scheduleWeekText">周日</span>

      </div>

<div class="modal-overlay" id="actionSheet" style="align-items:flex-end">

    <button class="action-item" id="actionDelete" onclick="" style="padding:16px 20px;font-size:15px;color:var(--danger);cursor:pointer;text-align:center;border:none;background:transparent;width:100%;font-family:inherit">删除</button>
    <button onclick="closeActionSheet()" style="padding:16px 20px;font-size:15px;color:var(--text-2);text-align:center;background:var(--bg);cursor:pointer;border:none;width:100%;font-family:inherit;margin-top:8px;border-radius:0 0 16px 16px">取消</button>
  </div>
</div>

<style>
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>

<script>
  // ====== Data ======
  let events = JSON.parse(localStorage.getItem('wb_events') || '[]');
  let inspirations = JSON.parse(localStorage.getItem('wb_inspirations') || '[]');
  let currentDate = formatDate(new Date());
  let calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let calendarOpen = false;
  let batchMode = false;
  let selectedForDelete = new Set();
  let summaryMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let summarySelectedDate = formatDate(new Date());
  let currentView = 'schedule';
  let editingEventId = null;
  let editingInspId = null;
  let selectedCat = '';
  let selectedPriority = '';
  let selectedQuickTag = 'feeling';
  let selectedEditTag = 'feeling';
  let currentFilter = 'all';
  let actionTarget = null;

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function save() {
    localStorage.setItem('wb_events', JSON.stringify(events));
    localStorage.setItem('wb_inspirations', JSON.stringify(inspirations));
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ====== Navigation ======
  function switchView(view, btn) {
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if (btn) btn.classList.add('active');
    else {
      const target = document.querySelector(`.nav-item[data-view="${view}"]`);
      if (target) target.classList.add('active');
    }

    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(`view-${view}`).classList.add('active');

    const titles = { schedule: '日程安排', inspiration: '灵感', checkin: '打卡' };
    document.getElementById('pageTitle').textContent = titles[view];

    // Toggle header buttons
    const addBtn = document.querySelector('.header-actions [onclick="openScheduleModal()"]');
    const archiveBtn = document.getElementById('archiveBtn');
    const summaryBtn = document.getElementById('summaryBtn');

    if (view === 'schedule') {
      addBtn.style.display = 'flex';
      archiveBtn.style.display = 'none';
      summaryBtn.style.display = 'flex';
    } else if (view === 'inspiration') {
      addBtn.style.display = 'none';
      archiveBtn.style.display = 'flex';
      summaryBtn.style.display = 'none';
    } else {
      addBtn.style.display = 'none';
      archiveBtn.style.display = 'none';
      summaryBtn.style.display = 'none';
    }

    if (window.innerWidth <= 768) closeSidebar();

    if (view === 'schedule') { renderSchedule(); }
    else if (view === 'inspiration') renderInspirations();
    else if (view === 'checkin') renderCheckin();
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
  }

  // ====== Schedule ======
  function renderSchedule() {
    // Update sidebar count (events for current date)
    const dayEventsCount = events.filter(e => e.date === currentDate).length;
    document.getElementById('scheduleCount').textContent = dayEventsCount;

    // Update date header
    const d = new Date(currentDate);
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const todayStr = formatDate(new Date());

    if (currentDate === todayStr) {
      document.getElementById('selectedDateTitle').textContent = '今日日程';
    } else {
      document.getElementById('selectedDateTitle').textContent = '日程';
    }
    document.getElementById('scheduleDateText').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    document.getElementById('scheduleWeekText').textContent = weekdays[d.getDay()];

    // Update calendar if open
    if (calendarOpen) renderInlineCalendar();

    renderEventList();
  }

  function toggleCalendar() {
    calendarOpen = !calendarOpen;
    const cal = document.getElementById('inlineCalendar');
    if (calendarOpen) {
      cal.classList.add('show');
      renderInlineCalendar();
    } else {
      cal.classList.remove('show');
    }
  }

  function changeMonth(delta) {
    calendarMonth.setMonth(calendarMonth.getMonth() + delta);
    renderInlineCalendar();
  }

  function jumpToDate(dateStr) {
    if (!dateStr) return;
    const d = new Date(dateStr);
    calendarMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    currentDate = formatDate(d);
    renderSchedule();
  }

  function renderInlineCalendar() {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    document.getElementById('inlineCalTitle').textContent = `${year}年${monthNames[month]}`;

    // Weekdays
    const labels = ['日', '一', '二', '三', '四', '五', '六'];
    const wdContainer = document.getElementById('inlineCalWeekdays');
    wdContainer.innerHTML = '';
    labels.forEach((label, i) => {
      const el = document.createElement('div');
      el.className = 'weekday-label';
      if (i === 0 || i === 6) el.classList.add('weekend');
      el.textContent = label;
      wdContainer.appendChild(el);
    });

    const todayStr = formatDate(new Date());
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const grid = document.getElementById('inlineCalGrid');
    grid.innerHTML = '';

    // Previous month trailing days
    for (let i = startWeekday - 1; i >= 0; i--) {
      const day = prevMonthDays - i;
      const prevDate = new Date(year, month - 1, day);
      grid.appendChild(createCalDayCell(day, prevDate, todayStr, false));
    }

    // Current month days
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(year, month, day);
      grid.appendChild(createCalDayCell(day, d, todayStr, true));
    }

    // Next month leading days
    const totalCells = grid.children.length;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      const d = new Date(year, month + 1, i);
      grid.appendChild(createCalDayCell(i, d, todayStr, false));
    }
  }

  function createCalDayCell(dayNum, date, todayStr, isCurrentMonth) {
    const dateStr = formatDate(date);
    const cell = document.createElement('button');
    cell.className = 'cal-day';
    if (!isCurrentMonth) cell.classList.add('other-month');
    if (dateStr === todayStr) cell.classList.add('today');
    if (dateStr === currentDate) cell.classList.add('selected');

    const hasEvents = events.some(e => e.date === dateStr);
    cell.innerHTML = `
      <span class="day-num">${dayNum}</span>
      ${hasEvents ? '<span class="event-dot"></span>' : ''}
    `;
    cell.onclick = (e) => {
      e.stopPropagation();
      currentDate = dateStr;
      calendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);
      renderSchedule();
    };
    return cell;
  }

  function renderEventList() {
    const d = new Date(currentDate);
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const todayStr = formatDate(new Date());

    document.getElementById('selectedDateTitle').textContent = '今日日程';

    const dayEvents = events.filter(e => e.date === currentDate).sort((a, b) => a.start.localeCompare(b.start));
    document.getElementById('eventListCount').textContent = dayEvents.length > 0 ? `${dayEvents.length}项` : '';

    const list = document.getElementById('eventList');
    list.innerHTML = '';

    if (dayEvents.length === 0) {
      list.innerHTML = `<button class="add-event-btn" onclick="openScheduleModal()">+ 添加日程</button>`;
      return;
    }

    dayEvents.forEach(ev => {
      const card = document.createElement('div');
      const priority = ev.priority || '';
      card.className = `event-card${priority ? ` pri-${priority}` : ''}`;
      if (ev.done) card.classList.add('completed');
      if (batchMode && selectedForDelete.has(ev.id)) card.classList.add('batch-selected');

      const catNames = { personal: '个人', group: '集体' };
      const catLabel = ev.category ? (catNames[ev.category] || ev.category) : '';
      const priorityNames = { normal: '普通', important: '重要' };
      const priLabel = priority ? (priorityNames[priority] || priority) : '';

      let timeBlock = '';
      if (ev.start) {
        timeBlock = `<div class="event-time-block"><div class="start">${ev.start}</div>${ev.end ? `<div class="end">${ev.end}</div>` : ''}</div>`;
      }

      let tagsHtml = '';
      if (catLabel || priLabel) {
        tagsHtml = '<div class="event-tags">';
        if (catLabel) tagsHtml += `<span class="event-tag tag-cat">${escapeHtml(catLabel)}</span>`;
        if (priLabel) tagsHtml += `<span class="event-tag tag-pri tag-pri-${priority}">${escapeHtml(priLabel)}</span>`;
        tagsHtml += '</div>';
      }

      let checkboxHtml = '';
      if (batchMode) {
        const checked = selectedForDelete.has(ev.id) ? 'checked' : '';
        checkboxHtml = `<div class="batch-checkbox ${checked}" onclick="event.stopPropagation(); toggleBatchSelect('${ev.id}')"></div>`;
      } else {
        checkboxHtml = `<div class="event-checkbox ${ev.done ? 'checked' : ''}" onclick="event.stopPropagation(); toggleEventDone('${ev.id}')"></div>`;
      }

      card.innerHTML = `
        ${checkboxHtml}
        ${timeBlock}
        <div class="event-body">
          <div class="event-title">${escapeHtml(ev.title)}</div>
          ${tagsHtml}
        </div>
        <button class="event-delete-btn" onclick="event.stopPropagation(); deleteEvent('${ev.id}')" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
        </button>
      `;
      if (batchMode) {
        card.onclick = () => toggleBatchSelect(ev.id);
      } else {
        card.onclick = () => openScheduleModal(ev.id);
      }
      list.appendChild(card);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-event-btn';
    addBtn.textContent = '+ 添加日程';
    addBtn.onclick = () => openScheduleModal();
    list.appendChild(addBtn);
  }

  function toggleEventDone(id) {
    const ev = events.find(e => e.id === id);
    if (ev) { ev.done = !ev.done; save(); renderSchedule(); }
  }

  function deleteEvent(id) {
    events = events.filter(e => e.id !== id);
    save();
    renderSchedule();
  }

  // ====== Batch Delete ======
  function toggleBatchMode() {
    batchMode = !batchMode;
    selectedForDelete.clear();
    const btn = document.getElementById('batchDeleteBtn');
    const bar = document.getElementById('batchBar');
    btn.classList.toggle('active', batchMode);
    bar.classList.toggle('show', batchMode);
    renderSchedule();
  }

  function toggleBatchSelect(id) {
    if (selectedForDelete.has(id)) {
      selectedForDelete.delete(id);
    } else {
      selectedForDelete.add(id);
    }
    updateSelectAllState();
    renderSchedule();
  }

  function toggleSelectAll() {
    const dayEvents = events.filter(e => e.date === currentDate);
    const allChecked = document.getElementById('selectAllCheckbox').checked;
    if (allChecked) {
      dayEvents.forEach(ev => selectedForDelete.add(ev.id));
    } else {
      dayEvents.forEach(ev => selectedForDelete.delete(ev.id));
    }
    renderSchedule();
  }

  function updateSelectAllState() {
    const dayEvents = events.filter(e => e.date === currentDate);
    const checkbox = document.getElementById('selectAllCheckbox');
    if (checkbox) {
      checkbox.checked = dayEvents.length > 0 && dayEvents.every(ev => selectedForDelete.has(ev.id));
    }
  }

  function batchDelete() {
    if (selectedForDelete.size === 0) return;
    if (!confirm(`确定删除选中的 ${selectedForDelete.size} 个任务？`)) return;
    events = events.filter(e => !selectedForDelete.has(e.id));
    selectedForDelete.clear();
    save();
    batchMode = false;
    document.getElementById('batchDeleteBtn').classList.remove('active');
    document.getElementById('batchBar').classList.remove('show');
    renderSchedule();
  }

  // Clear all tasks for currently selected date
  function clearDateTasks() {
    const dayEvents = events.filter(e => e.date === currentDate);
    if (dayEvents.length === 0) return;
    if (!confirm(`确定删除 ${currentDate} 的所有 ${dayEvents.length} 个任务？`)) return;
    events = events.filter(e => e.date !== currentDate);
    save();
    renderSchedule();
  }

  function openScheduleModal(id) {
    editingEventId = id || null;
    const title = document.getElementById('scheduleModalTitle');

    if (id) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;
      title.textContent = '编辑日程';
      document.getElementById('eventTitle').value = ev.title;
      document.getElementById('eventStart').value = ev.start || '';
      document.getElementById('eventEnd').value = ev.end || '';
      selectedCat = ev.category || '';
      selectedPriority = ev.priority || '';
    } else {
      title.textContent = '新建日程';
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventStart').value = '';
      document.getElementById('eventEnd').value = '';
      selectedCat = '';
      selectedPriority = '';
    }

    document.querySelectorAll('.option-chip[data-cat]').forEach(c => {
      c.classList.toggle('selected', c.dataset.cat === selectedCat);
    });
    document.querySelectorAll('.option-chip[data-priority]').forEach(c => {
      c.classList.toggle('selected', c.dataset.priority === selectedPriority);
    });

    document.getElementById('scheduleModal').classList.add('show');
    setTimeout(() => document.getElementById('eventTitle').focus(), 200);
  }

  function closeScheduleModal() {
    document.getElementById('scheduleModal').classList.remove('show');
    editingEventId = null;
  }

  function selectCat(el) {
    const val = el.dataset.cat;
    if (selectedCat === val) {
      el.classList.remove('selected');
      selectedCat = '';
    } else {
      document.querySelectorAll('.option-chip[data-cat]').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedCat = val;
    }
  }

  function selectPriority(el) {
    const val = el.dataset.priority;
    if (selectedPriority === val) {
      el.classList.remove('selected');
      selectedPriority = '';
    } else {
      document.querySelectorAll('.option-chip[data-priority]').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedPriority = val;
    }
  }

  function saveEvent() {
    const title = document.getElementById('eventTitle').value.trim();
    if (!title) { document.getElementById('eventTitle').focus(); return; }
    const start = document.getElementById('eventStart').value;
    const end = document.getElementById('eventEnd').value;

    if (editingEventId) {
      const ev = events.find(e => e.id === editingEventId);
      if (ev) { ev.title = title; ev.start = start; ev.end = end; ev.category = selectedCat; ev.priority = selectedPriority; }
    } else {
      events.push({ id: genId(), title, start, end, date: currentDate, category: selectedCat, priority: selectedPriority, done: false, createdAt: Date.now() });
    }

    save();
    closeScheduleModal();
    renderSchedule();
  }

  function showEventActions(id) {
    actionTarget = id;
    const ev = events.find(e => e.id === id);
    if (!ev) return;

    const sheet = document.getElementById('actionSheet');
    document.getElementById('actionEdit').onclick = () => { closeActionSheet(); setTimeout(() => openScheduleModal(id), 200); };
    document.getElementById('actionStar').style.display = 'none';
    document.getElementById('actionDelete').onclick = () => {
      events = events.filter(e => e.id !== id);
      save();
      closeActionSheet();
      renderSchedule();
    };
    sheet.classList.add('show');
  }

  // ====== Inspiration ======
  function updateCaptureBtn() {
    const val = document.getElementById('quickInput').value.trim();
    document.getElementById('captureBtn').disabled = !val;
  }

  function selectQuickTag(el) {
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedQuickTag = el.dataset.tag;
  }

  function quickCapture() {
    const content = document.getElementById('quickInput').value.trim();
    if (!content) return;

    inspirations.unshift({

  function renderArchive() {
    const content = document.getElementById('archiveContent');
    const tagNames = { feeling: '感受', question: '疑问', idea: '想法', todo: '待办', quote: '金句' };

    // Filter by selected year
    const yearInspirations = inspirations.filter(ins => {
      const d = new Date(ins.createdAt);
      return d.getFullYear() === archiveYear;
    });

    if (yearInspirations.length === 0) {
      content.innerHTML = `<div class="archive-empty">${archiveYear}年还没有灵感</div>`;
      return;
    }

    // Group by year-month
    const groups = {};
    yearInspirations.forEach(ins => {
      const d = new Date(ins.createdAt);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      if (!groups[key]) groups[key] = [];
      groups[key].push(ins);
    });

    // Sort keys descending (newest first)
    const sortedKeys = Object.keys(groups).sort().reverse();

    let html = '';
    sortedKeys.forEach((key, idx) => {
      const [year, month] = key.split('-');
      const items = groups[key];
      const expanded = idx === 0 ? 'expanded' : ''; // first month expanded by default

      html += `
        <div class="archive-month-group ${expanded}" data-month="${key}">
          <div class="archive-month-header" onclick="toggleArchiveMonth('${key}')">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="archive-month-title">${year}年${parseInt(month)}月</span>
              <span class="archive-month-count">${items.length}条</span>
            </div>
            <span class="archive-month-arrow">▼</span>
          </div>
          <div class="archive-month-items">
      `;

      // Sort items by date descending
      items.sort((a, b) => b.createdAt - a.createdAt);

      items.forEach(ins => {
        const d = new Date(ins.createdAt);
        const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        const tagClass = `archive-item-tag tag-${ins.tag}`;
        const tagStyle = ins.tag === 'feeling' 
          ? 'background:#ffffff;color:#8b7ab5;border:1px solid #e0d8ec;'
          : ins.tag === 'question'
            ? 'background:#ffffff;color:#b09b74;border:1px solid #e0d6c0;'
            : 'background:#e0e7ff;color:#4f46e5;';

        html += `
          <div class="archive-item" onclick="openArchiveItem('${ins.id}')">
            <div class="archive-item-text">${escapeHtml(ins.content)}</div>
            <div class="archive-item-meta">
              <span class="${tagClass}" style="${tagStyle}">${tagNames[ins.tag] || ins.tag}</span>
              <span>${dateStr}</span>
            </div>
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;
    });

    content.innerHTML = html;

  function renderSummary() {
    const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    const year = summaryMonth.getFullYear();
    const month = summaryMonth.getMonth();
    document.getElementById('summaryCalTitle').textContent = `${year}年${monthNames[month]}`;

    // Month stats
    const monthEvents = events.filter(e => {
      const d = new Date(e.date);
      return d.getFullYear() === year && d.getMonth() === month;
    });
    const totalCount = monthEvents.length;
    const doneCount = monthEvents.filter(e => e.done).length;
    const rate = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

    document.getElementById('statTotal').textContent = totalCount;
    document.getElementById('statDone').textContent = doneCount;
    document.getElementById('statRate').textContent = rate + '%';

    // Trend charts
    drawMonthTrendChart();

    // Month stats below calendar
    document.getElementById('monthStatTotal').textContent = totalCount;
    document.getElementById('monthStatDone').textContent = doneCount;
    document.getElementById('monthStatRate').textContent = rate + '%';

    // Render weekday labels
    const wdLabels = ['日', '一', '二', '三', '四', '五', '六'];
    const wdContainer = document.getElementById('summaryCalWeekdays');
    wdContainer.innerHTML = '';
    wdLabels.forEach(label => {
      const el = document.createElement('div');
      el.className = 'wd-label';
      el.textContent = label;
      wdContainer.appendChild(el);
    });

    // Render calendar grid
    const todayStr = formatDate(new Date());
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const grid = document.getElementById('summaryCalGrid');
    grid.innerHTML = '';

    // Prev month trailing days
    for (let i = startWeekday - 1; i >= 0; i--) {
      const day = prevMonthDays - i;
      const d = new Date(year, month - 1, day);
      grid.appendChild(createSummaryCalCell(day, d, todayStr, false));
    }

    // Current month days
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(year, month, day);
      grid.appendChild(createSummaryCalCell(day, d, todayStr, true));
    }

    // Next month leading days
    const totalCells = grid.children.length;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      const d = new Date(year, month + 1, i);
      grid.appendChild(createSummaryCalCell(i, d, todayStr, false));
    }
  }

  function createSummaryCalCell(dayNum, date, todayStr, isCurrentMonth) {
    const dateStr = formatDate(date);
    const cell = document.createElement('button');
    cell.className = 'summary-cal-cell';

    if (dateStr === todayStr) cell.classList.add('today');
    if (dateStr === summarySelectedDate) cell.classList.add('selected');

    const dayEvents = events.filter(e => e.date === dateStr);
    const hasDone = dayEvents.some(e => e.done);
    const hasTask = dayEvents.length > 0;

    // Day number
    const num = document.createElement('span');
    num.className = 'cal-day-num';
    num.textContent = dayNum;
    cell.appendChild(num);

    // Dot indicator
    if (hasDone || hasTask) {
      const dot = document.createElement('span');
      dot.className = 'cal-day-dot';
      if (hasDone) dot.classList.add('dot-done');
      else dot.classList.add('dot-task');
      cell.appendChild(dot);

    cell.onclick = () => {
      summarySelectedDate = dateStr;
      // If clicking other month, jump to that month

        summaryMonth = new Date(date.getFullYear(), date.getMonth(), 1);

  // ====== Trend Charts ======
  function getMonthDates(year, month) {
    const dates = [];
    const daysInMonth = new Date(year, month + 1, 0).getDate();

  function drawLineChart(canvasId, dateList, options = {}) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);

    const W = rect.width;
    const H = rect.height;
    const padL = 24, padR = 12, padT = 12, padB = 24;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;

    const totalData = [];
    const doneData = [];
    let maxVal = 0;
    dateList.forEach(dateStr => {
      const dayEvents = events.filter(e => e.date === dateStr);
      const total = dayEvents.length;
      const done = dayEvents.filter(e => e.done).length;
      totalData.push(total);
      doneData.push(done);
      if (total > maxVal) maxVal = total;
    });

    if (maxVal === 0) maxVal = 1;
    maxVal = Math.ceil(maxVal / 2) * 2 || 2;

    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = '#eef0f5';
    ctx.lineWidth = 1;
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#999';
    const gridLines = 3;
    for (let i = 0; i <= gridLines; i++) {
      const y = padT + (chartH / gridLines) * i;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(W - padR, y);
      ctx.stroke();
      const val = Math.round(maxVal - (maxVal / gridLines) * i);
      ctx.fillText(val, 4, y + 3);
    }

    const stepX = chartW / Math.max(dateList.length - 1, 1);

    function getPoints(data) {
      return data.map((val, i) => ({
        x: padL + stepX * i,
        y: padT + chartH - (val / maxVal) * chartH
      }));
    }

    // Total line (dashed, light gray)
    const totalPoints = getPoints(totalData);
    ctx.strokeStyle = '#b8c0d4';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    totalPoints.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
    ctx.setLineDash([]);

    // Done line (solid, primary)
    const donePoints = getPoints(doneData);
    ctx.strokeStyle = '#7ba7d9';
    ctx.lineWidth = 2;
    ctx.beginPath();
    donePoints.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();

    // Done area fill
    ctx.fillStyle = 'rgba(123, 167, 217, 0.15)';
    ctx.beginPath();
    donePoints.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.lineTo(donePoints[donePoints.length - 1].x, padT + chartH);
    ctx.lineTo(donePoints[0].x, padT + chartH);
    ctx.closePath();
    ctx.fill();

    // Done dots
    donePoints.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#7ba7d9';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#7ba7d9';
      ctx.fill();
    });

    // X-axis labels
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    const todayStr = formatDate(new Date());
    const showEvery = dateList.length > 15 ? Math.ceil(dateList.length / 10) : 1;

    dateList.forEach((dateStr, i) => {
      if (i % showEvery !== 0 && i !== dateList.length - 1) return;
      const d = new Date(dateStr);
      const x = padL + stepX * i;
      const isToday = dateStr === todayStr;

      ctx.fillStyle = isToday ? '#7ba7d9' : '#999';
      const label = options.showMonth ? `${d.getMonth() + 1}/${d.getDate()}` : d.getDate();
      ctx.fillText(label, x, H - 8);
    });
  }
