    renderCheckin();
  }

  function calcItemStreak(itemId) {
    let streak = 0;
    const today = new Date();
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dateStr = formatCheckinDate(d);
      if (checkinRecords[dateStr] && checkinRecords[dateStr].includes(itemId)) {
        streak++;
      } else {
        break;
      }
    }
    return streak;
  }

  function changeCheckinMonth(delta) {
    checkinMonth = new Date(checkinMonth.getFullYear(), checkinMonth.getMonth() + delta, 1);
    renderCheckinCalendar();
  }

  function renderCheckinCalendar() {
    const grid = document.getElementById('checkinCalGrid');
    const label = document.getElementById('checkinMonthLabel');
    if (!grid) return;

    const year = checkinMonth.getFullYear();
    const month = checkinMonth.getMonth();
    label.textContent = `${year}年${month + 1}月`;

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startWeekday = firstDay.getDay();
    const daysInMonth = lastDay.getDate();

    const today = new Date();
    const todayStr = formatCheckinDate(today);

    grid.innerHTML = '';

    // Previous month padding
    const prevMonthLast = new Date(year, month, 0).getDate();
    for (let i = startWeekday - 1; i >= 0; i--) {
      const cell = document.createElement('div');
      cell.className = 'checkin-cell other-month';
      cell.textContent = prevMonthLast - i;
      grid.appendChild(cell);
    }

    // Current month
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = 'checkin-cell';

      const num = document.createElement('span');
      num.className = 'cal-day-num';
      num.textContent = d;
      cell.appendChild(num);

      const checked = checkinRecords[dateStr] || [];
      const total = checkinItems.length;
      if (total > 0 && checked.length > 0) {
        const dot = document.createElement('span');
        dot.className = 'cal-day-dot';
        if (checked.length === total) {
          cell.classList.add('checked');
        } else {
          cell.classList.add('partial');
        }
        cell.appendChild(dot);
      }
      if (dateStr === todayStr) cell.classList.add('today');
      grid.appendChild(cell);
    }

    // Next month padding
    const totalCells = startWeekday + daysInMonth;
    const remain = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remain; i++) {
      const cell = document.createElement('div');
      cell.className = 'checkin-cell other-month';
      cell.textContent = i;
      grid.appendChild(cell);
    }
  }

  function renderCheckinItems() {
    const container = document.getElementById('checkinItems');
    const empty = document.getElementById('checkinItemsEmpty');
    if (!container) return;

    if (checkinItems.length === 0) {
      container.innerHTML = '';
      container.appendChild(empty);
      empty.style.display = 'flex';
      return;
    }

    const todayStr = formatCheckinDate(new Date());
    const todayChecked = checkinRecords[todayStr] || [];

    container.innerHTML = '';
    checkinItems.forEach(item => {
      const isChecked = todayChecked.includes(item.id);
      const streak = calcItemStreak(item.id);
      const div = document.createElement('div');
      div.className = 'checkin-item' + (isChecked ? ' checked' : '');
      div.innerHTML = `
        <div class="checkin-item-checkbox" onclick="toggleCheckin('${item.id}')">
          <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="checkin-item-info" onclick="toggleCheckin('${item.id}')">
          <div class="checkin-item-name">${item.name}</div>
          <div class="checkin-item-streak">连续打卡 ${streak} 天</div>
        </div>
        <button class="checkin-item-delete" onclick="deleteCheckinItem('${item.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"/></svg>
        </button>
      `;
      container.appendChild(div);
    });
  }

  function renderCheckin() {
    const today = new Date();
    const todayStr = formatCheckinDate(today);
    const weekday = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][today.getDay()];
    const dateEl = document.getElementById('checkinTodayDate');
    if (dateEl) dateEl.textContent = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日 ${weekday}`;

    const total = checkinItems.length;
    const checked = (checkinRecords[todayStr] || []).length;

    const streakEl = document.getElementById('streakNum');
    if (streakEl) streakEl.textContent = checked;

    const progressEl = document.getElementById('checkinProgress');
    if (progressEl) progressEl.textContent = `${checked} / ${total}`;

    checkinMonth = new Date();
    renderCheckinItems();
    renderCheckinCalendar();
  }

  // Init
  renderSchedule();
  renderInspirations();

  // Redraw charts on window resize (debounced)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const summaryPage = document.getElementById('pageSummary');
      if (summaryPage && summaryPage.classList.contains('active')) {
        drawMonthTrendChart();
      }
    }, 150);
  });

  // Register Service Worker for PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
    });
  }
</script>

  <div class="day-popup-header">
    <span class="day-popup-title" id="dayPopupTitle">9月27日 周日</span>
    <button class="icon-btn" onclick="closeDayPopup()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="day-popup-body" id="dayPopupList"></div>
</div>

</body>
